name: release-please

on:
  push:
    branches:
      - main

# Least privilege: commit the version bump / tag / release, and open the release PR.
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
