name: claude

# Call the agent from a comment: write `@claude <task>` in an issue, a PR or a PR review.
# Needs the Claude GitHub App on the repository and the CLAUDE_CODE_OAUTH_TOKEN secret
# (both are set up by `/install-github-app`).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# One agent run per issue / PR at a time; a newer comment waits for the running one.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Only people with write access can call the agent (the repository is public), and only when
    # the comment mentions @claude.
    if: |
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # the action exchanges the OIDC token for the Claude GitHub App token
      actions: read # lets the agent read CI results on PRs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Same toolchain as ci.yml, so the agent can run `mise run check` before it pushes.
      - uses: jdx/mise-action@v4
        with:
          version: 2026.10.24
          experimental: true
      - run: mise run install

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # There is no CLAUDE.md, the project rules live in AGENTS.md.
          claude_args: |
            --model claude-haiku-5-5
            --max-turns 40
            --allowedTools "Bash(mise run *),Bash(gh pr *),Bash(gh issue *),Bash(git *)"
            --append-system-prompt "Read AGENTS.md first and follow it: Conventional Commits, the contract in api/main.tsp changes first, keep `mise run check` green before you push. Never edit or delete .github/workflows/hexlet-check.yml."
